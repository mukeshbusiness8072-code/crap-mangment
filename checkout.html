<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b4332" />
    <title>Checkout – MV Mukesh Vanitha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="/src/css/variables.css" />
    <link rel="stylesheet" href="/src/css/layout.css" />
    <link rel="stylesheet" href="/src/css/components.css" />
    <link rel="stylesheet" href="/src/css/mobile.css" />
    <link rel="icon" href="/images/logo-mv-organic.png" type="image/png" />
    <link rel="apple-touch-icon" href="/images/logo-mv-organic.png" />
  </head>
  <body>
    <div class="announcement"></div>
    <header class="site-header">
      <div class="container header-inner">
        <a href="/catalog.html" class="logo"></a>
        <form class="header-search" role="search" action="/catalog.html" method="get">
          <input type="search" name="q" placeholder="Search..." aria-label="Search" />
          <button type="submit" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>
        <div class="header-actions">
          <button type="button" class="icon-btn cart-trigger" aria-label="Cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count">0</span>
            <span class="cart-total-text">Rs. 0.00</span>
          </button>
          <button type="button" class="menu-toggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        </div>
        <nav class="mobile-nav" aria-label="Mobile">
          <a href="/catalog.html">Shop</a>
          <a href="/checkout.html">Checkout</a>
        </nav>
      </div>
    </header>

    <main class="checkout-page container">
      <h1>Checkout</h1>
      <p id="checkout-empty" class="checkout-empty">Your cart is empty. <a href="/catalog.html">Continue shopping</a></p>
      <ul id="checkout-lines" class="checkout-lines"></ul>
      <div id="checkout-summary" class="checkout-summary" style="display:none">
        <p>Subtotal: <strong id="checkout-subtotal"></strong></p>
        <p>Discount (<span id="checkout-coupon"></span>): <strong id="checkout-discount"></strong></p>
        <p class="checkout-total-row">Total: <strong id="checkout-total"></strong></p>
        <button type="button" id="place-order" class="btn-checkout">Place order</button>
        <p class="checkout-contact">We will call you at <span data-site-phone></span> to confirm.</p>
        <a href="/catalog.html" class="btn-continue-link">Back to shop</a>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p class="footer-bottom"></p>
      </div>
    </footer>

    <script type="module" src="/src/js/checkout.js"></script>
  </body>
</html>
